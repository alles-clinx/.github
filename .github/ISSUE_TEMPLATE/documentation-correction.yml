name: Documentation or data correction
description: Report a broken link, metadata mismatch, typo or public repository inconsistency.
title: "[Correction] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for public repository corrections only. Do not post confidential information or safety-critical chemical questions.
  - type: input
    id: file
    attributes:
      label: Affected file or URL
      placeholder: https://github.com/alles-clinx/...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What appears to be incorrect?
      description: Describe the discrepancy precisely.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected correction
      description: If known, state what the corrected information should be and cite the public source.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included confidential, personal or security-sensitive information.
          required: true
