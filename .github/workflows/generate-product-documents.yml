name: Generate product document library

on:
  push:
    branches: [main]
    paths:
      - 'document-source/products.csv'
      - 'scripts/generate_product_documents.py'
      - 'scripts/generate_detailed_usage_guides.py'
      - '.github/workflows/generate-product-documents.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-croscore
          python -m pip install --upgrade pip
          python -m pip install reportlab

      - name: Generate TDS and SOP PDFs
        run: python scripts/generate_product_documents.py

      - name: Generate detailed Usage Guide PDFs
        run: python scripts/generate_detailed_usage_guides.py

      - name: Verify document counts
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tds -maxdepth 1 -type f -iname '*.pdf' | wc -l | tr -d ' ')" -eq 35
          test "$(find usage-guides -maxdepth 1 -type f -iname '*.pdf' | wc -l | tr -d ' ')" -eq 35
          test "$(find sops -maxdepth 1 -type f -iname '*.pdf' | wc -l | tr -d ' ')" -eq 35

      - name: Commit generated document library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Alle's ClinX Documentation Bot"
          git config user.email "care@allesclinx.com"
          git add tds usage-guides sops document-source/generated-manifest.csv
          if git diff --cached --quiet; then
            echo "No generated document changes to commit."
            exit 0
          fi
          git commit -m "Publish final TDS, detailed usage guide and SOP libraries [skip ci]"
          git push
