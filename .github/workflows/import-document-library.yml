name: Import document library

on:
  push:
    paths:
      - 'incoming/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded document archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p tds usage-guides sops resources

          tds_reset=0
          usage_reset=0
          sop_reset=0
          resource_reset=0

          extract_flat_pdfs() {
            archive="$1"
            target="$2"
            unzip -Z1 "$archive" | while IFS= read -r entry; do
              case "$entry" in
                */) continue ;;
                *.pdf|*.PDF)
                  out="$target/$(basename "$entry")"
                  unzip -p "$archive" "$entry" > "$out"
                  ;;
              esac
            done
          }

          shopt -s nullglob
          for archive in incoming/*.zip; do
            name="$(basename "$archive" | tr '[:upper:]_' '[:lower:]-')"

            case "$name" in
              *technical-data-sheet*|*tds*)
                if [ "$tds_reset" -eq 0 ]; then
                  find tds -maxdepth 1 -type f -iname '*.pdf' -delete
                  tds_reset=1
                fi
                extract_flat_pdfs "$archive" tds
                ;;
              *usage-guide*)
                if [ "$usage_reset" -eq 0 ]; then
                  find usage-guides -maxdepth 1 -type f -iname '*.pdf' -delete
                  usage_reset=1
                fi
                extract_flat_pdfs "$archive" usage-guides
                ;;
              *sop*)
                if [ "$sop_reset" -eq 0 ]; then
                  find sops -maxdepth 1 -type f -iname '*.pdf' -delete
                  sop_reset=1
                fi
                extract_flat_pdfs "$archive" sops
                ;;
              *free-hygiene-resource*|*hygiene-resource*)
                if [ "$resource_reset" -eq 0 ]; then
                  find resources -type f -iname '*.pdf' -delete
                  resource_reset=1
                fi
                unzip -oq "$archive" -d resources
                ;;
              *)
                echo "Unrecognized archive name: $archive"
                exit 1
                ;;
            esac
          done

          find tds usage-guides sops resources -type d -name '__MACOSX' -prune -exec rm -rf {} + 2>/dev/null || true
          find tds usage-guides sops resources -type f -name '.DS_Store' -delete 2>/dev/null || true

          rm -f incoming/*.zip

      - name: Verify expected library counts
        shell: bash
        run: |
          set -euo pipefail
          tds_count=$(find tds -type f -iname '*.pdf' | wc -l | tr -d ' ')
          usage_count=$(find usage-guides -type f -iname '*.pdf' | wc -l | tr -d ' ')
          sop_count=$(find sops -type f -iname '*.pdf' | wc -l | tr -d ' ')
          resource_count=$(find resources -type f -iname '*.pdf' | wc -l | tr -d ' ')

          echo "TDS: ${tds_count}"
          echo "Usage Guides: ${usage_count}"
          echo "SOPs: ${sop_count}"
          echo "Resource PDFs: ${resource_count}"

          test "${tds_count}" -eq 35
          test "${usage_count}" -eq 35
          test "${sop_count}" -eq 35
          test "${resource_count}" -eq 51

      - name: Commit extracted PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Alle's ClinX Documentation Bot"
          git config user.email "care@allesclinx.com"
          git add tds usage-guides sops resources incoming

          if git diff --cached --quiet; then
            echo "No document changes to commit."
            exit 0
          fi

          git commit -m "Import TDS, SOP, usage guide and hygiene resource libraries [skip ci]"
          git push
